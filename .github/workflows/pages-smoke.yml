name: Pages custom-domain smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Use pinned Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked toolchain
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check canonical custom domain
        env:
          SMOKE_URL: https://codeoverdose.es/
        run: npm run check:smoke
      - name: Check canonical Chromium journeys
        env:
          BASE_URL: https://codeoverdose.es/
          CANONICAL_LIVE: "1"
        run: npx playwright test tests/visual/canonical-live.spec.mjs
